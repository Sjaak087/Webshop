name: Publish NOIR webshop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v7
      - name: GitHub Pages instellen
        uses: actions/configure-pages@v5
      - name: Websitebestanden klaarzetten
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Website publiceren
        id: deployment
        uses: actions/deploy-pages@v4
